<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wana Bingo - Ready Countdown</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #03141e; color: white; padding-bottom: 70px; user-select: none; }

        .status-header {
            background-color: #d4edda; color: #155724; text-align: center;
            padding: 4px; font-size: 11px; font-weight: bold; position: sticky; top: 0; z-index: 200;
        }

        .container { padding: 8px; }

        /* LOBBY STYLES */
        .weekly-banner {
            background: linear-gradient(135deg, #093444, #082937);
            border: 1px solid #1a566e; border-radius: 10px; padding: 10px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .prize-amount { color: #ffc107; font-size: 16px; font-weight: bold; text-align: right; }
        .table-header { display: flex; justify-content: space-between; font-size: 11px; color: #88a0a8; padding: 0 5px 6px 5px; font-weight: bold; }
        
        .room-card { 
            background: #092838; border-radius: 8px; padding: 10px; margin-bottom: 10px; 
            border: 1px solid #143e52; position: relative; 
        }
        .room-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .bet-val { font-size: 15px; font-weight: bold; color: #00e676; }
        .win-val { font-size: 15px; font-weight: bold; color: #ff5252; }
        .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; background: #11313e; margin-right: 5px; }
        .running { color: #00e676; }
        .btn-join { background: #ff5722; color: white; border: none; padding: 6px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* SELECTION PAGE */
        .top-metrics { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .metric-pill {
            background: #092e42; border-radius: 8px; padding: 5px; text-align: center; 
            font-size: 8px; color: #88a0a8; border: 1px solid #14435c; cursor: pointer; flex: 1; margin: 0 2px;
        }
        .metric-pill span { display: block; font-size: 11px; font-weight: bold; color: #00e676; margin-top: 2px; }
        .boards-grid {
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px;
            max-height: 350px; overflow-y: auto; margin-bottom: 10px; padding: 2px;
        }
        .board-num {
            background: #092636; border: 1px solid #12415c; border-radius: 4px;
            height: 28px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; cursor: pointer;
        }
        .board-num.selected { background: #00e676; color: black; border-color: #00e676; }
        .action-row { display: flex; justify-content: space-between; gap: 6px; }
        .btn-action { flex: 1; padding: 8px; border-radius: 12px; border: none; font-weight: bold; font-size: 10px; color: white; cursor: pointer; }

        /* LIVE GAME PAGE */
        .game-top-bar { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 8px; }
        .top-card { background: #092e42; border-radius: 6px; padding: 4px; text-align: center; flex: 1; border: 1px solid #14435c; }
        .top-card label { display: block; font-size: 8px; color: #88a0a8; }
        .top-card span { font-size: 11px; font-weight: bold; color: #4fd1c5; }

        .audio-btn {
            background: #14435c; border: 1px solid #00e676; color: #00e676;
            border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .game-main-layout { display: flex; gap: 6px; align-items: flex-start; }

        /* Left Side: 1-75 Numbers Board */
        .call-board-left { width: 42%; background: #082535; border-radius: 8px; padding: 4px; border: 1px solid #103a50; }
        .board-header-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; text-align: center; font-weight: bold; font-size: 9px; margin-bottom: 3px; }
        .b-h { background: #e53935; color: white; border-radius: 2px; }
        .i-h { background: #1e88e5; color: white; border-radius: 2px; }
        .n-h { background: #43a047; color: white; border-radius: 2px; }
        .g-h { background: #fb8c00; color: white; border-radius: 2px; }
        .o-h { background: #8e24aa; color: white; border-radius: 2px; }

        .numbers-grid-75 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .num-cell { background: #0d3448; color: #7f9ca7; text-align: center; padding: 3px 0; border-radius: 2px; font-size: 8px; font-weight: bold; transition: all 0.3s; }
        .num-cell.called { background: #00e676; color: #000; font-weight: bold; }
        .num-cell.last-called { background: #ff2a2a; color: #fff; font-weight: bold; box-shadow: 0 0 8px #ff2a2a; }

        /* Right Side: Cartela & Call Display */
        .cartela-section-right { width: 58%; display: flex; flex-direction: column; gap: 6px; }
        
        .current-call-box {
            background: linear-gradient(90deg, #1e88e5, #1565c0); border-radius: 8px; 
            padding: 6px; text-align: center; font-size: 12px; font-weight: bold; color: white; min-height: 52px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .call-text-large { font-size: 20px; font-weight: bold; color: #ffeb3b; }

        .recent-calls { display: flex; gap: 2px; justify-content: space-between; min-height: 20px; }
        .call-pill { padding: 2px 4px; border-radius: 4px; font-size: 8px; font-weight: bold; color: white; flex: 1; text-align: center; }

        .cartela-card { background: #0a2d3e; border-radius: 8px; padding: 5px; border: 1px solid #184b66; text-align: center; }
        .cartela-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-bottom: 4px; }
        .c-cell {
            background: #ffffff; color: #111; border-radius: 4px; aspect-ratio: 1; 
            display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .c-cell.free-star { background: #00e676; color: white; font-size: 11px; }
        .c-cell.marked { background: #ff2a2a; color: white; }

        .cartela-footer { font-size: 9px; color: #88a0a8; font-weight: bold; }

        .game-controls { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .btn-bingo { background: linear-gradient(90deg, #ff9800, #f57c00); color: white; border: none; padding: 10px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; text-transform: uppercase; }
        .btn-bottom-row { display: flex; gap: 6px; }
        .btn-sub { flex: 1; padding: 8px; border-radius: 12px; border: none; font-weight: bold; font-size: 10px; color: white; cursor: pointer; }

        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div class="status-header">
        <i class="fa-solid fa-circle-check"></i> Connected
    </div>

    <div class="container">

        <!-- LOBBY PAGE -->
        <div id="lobbyPage" class="page active">
            <div class="weekly-banner">
                <div>
                    <div style="font-size: 9px; color: #4fd1c5;">🎉 ሳምንታዊ አሸናፊዎች ዋና ስጦታ! 🎉</div>
                </div>
                <div>
                    <div class="prize-amount"><i class="fa-solid fa-trophy"></i> 20,000 ETB</div>
                </div>
            </div>

            <div class="table-header">
                <span>BET</span><span>POSSIBLE WIN</span><span>STATUS & JOIN</span>
            </div>

            <div class="room-card">
                <div class="room-top">
                    <div class="bet-val">10 ETB</div><div class="win-val">506 ETB</div>
                    <div><span class="status-badge running">running</span><button class="btn-join" onclick="goToSelection(10)">Join</button></div>
                </div>
            </div>
        </div>

        <!-- SELECTION PAGE -->
        <div id="selectionPage" class="page">
            <div class="top-metrics">
                <div class="metric-pill" onclick="leaveGame()">Back<br><span>←</span></div>
                <div class="metric-pill">Stake<br><span id="currentStake">10 ETB</span></div>
            </div>
            <div class="boards-grid" id="boardsGrid"></div>
            <div class="action-row">
                <button class="btn-action" style="background: #007791;" onclick="generateGrid()">Refresh</button>
                <button class="btn-action" style="background: #2ecc71;" onclick="randomSelect()">Random</button>
                <button class="btn-action" style="background: #ff5722;" onclick="startLiveGame()">Start Game</button>
            </div>
        </div>

        <!-- LIVE GAME PAGE -->
        <div id="gamePage" class="page">
            <div class="game-top-bar">
                <div class="top-card"><label>Games</label><span>1</span></div>
                <div class="top-card"><label>Call</label><span id="callCount">0</span></div>
                <button class="audio-btn" id="audioToggleBtn" onclick="toggleAudio()">
                    <i class="fa-solid fa-volume-high" id="audioIcon"></i>
                </button>
            </div>

            <div class="game-main-layout">
                <!-- LEFT 75 BOARD -->
                <div class="call-board-left">
                    <div class="board-header-row">
                        <div class="b-h">B</div><div class="i-h">I</div><div class="n-h">N</div><div class="g-h">G</div><div class="o-h">O</div>
                    </div>
                    <div class="numbers-grid-75" id="grid75"></div>
                </div>

                <!-- RIGHT CARTELA & CALLS -->
                <div class="cartela-section-right">
                    <div class="current-call-box" id="callBoxContainer">
                        <span id="callStatusTitle" style="font-size: 10px; color: #b2ebf2;">ይዘጋጁ</span>
                        <span class="call-text-large" id="currentCallText">--</span>
                    </div>
                    
                    <div class="recent-calls" id="recentCallsContainer"></div>

                    <div class="cartela-card">
                        <div class="board-header-row" style="margin-bottom: 3px;">
                            <div class="b-h">B</div><div class="i-h">I</div><div class="n-h">N</div><div class="g-h">G</div><div class="o-h">O</div>
                        </div>
                        <div class="cartela-grid" id="playerCartela"></div>
                        <div class="cartela-footer">Cartela Number: <span id="cartelaIdDisplay" style="color:white;">--</span></div>
                    </div>
                </div>
            </div>

            <div class="game-controls">
                <button class="btn-bingo" onclick="checkBingo()">Bingo</button>
                <div class="btn-bottom-row">
                    <button class="btn-sub" style="background: #0097a7;" onclick="resetUserMarks()">Clear Marks</button>
                    <button class="btn-sub" style="background: #e53935;" onclick="leaveGame()">Leave Game</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let selectedBoard = null;
        let callInterval = null;
        let countdownTimer = null;
        let uncalledPool = [];
        let calledNumbersHistory = [];
        let lastCalledNum = null;
        let isAudioEnabled = true;

        // 🔊 Audio Synthesizer
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 🔔 ቆጠራ እና ቁጥር ቢፕ ድምፅ
        function playBeep(freq, duration = 0.15) {
            if (!isAudioEnabled) return;
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } catch(e){}
        }

        // 🎉 የአሸናፊነት ድምፅ
        function playWinSound() {
            if (!isAudioEnabled) return;
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.12));
                    gain.gain.setValueAtTime(0.3, now + (i * 0.12));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.12) + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.12));
                    osc.stop(now + (i * 0.12) + 0.3);
                });
            } catch(e){}
        }

        let userMarkedGrid = [
            [false, false, false, false, false],
            [false, false, false, false, false],
            [false, false, true,  false, false],
            [false, false, false, false, false],
            [false, false, false, false, false]
        ];

        const cartelaData = [
            [7, 25, 37, 60, 70],
            [13, 20, 43, 50, 69],
            [4, 18, '*', 55, 74],
            [5, 26, 40, 48, 67],
            [8, 17, 39, 46, 73]
        ];

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function goToSelection(stake) {
            document.getElementById('currentStake').innerText = stake + " ETB";
            showPage('selectionPage');
            generateGrid();
        }

        function generateGrid() {
            const grid = document.getElementById('boardsGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 500; i++) {
                let div = document.createElement('div');
                div.className = 'board-num'; div.innerText = i;
                div.onclick = () => selectBoard(i, div);
                grid.appendChild(div);
            }
        }

        function selectBoard(num, el) {
            document.querySelectorAll('.board-num').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedBoard = num;
        }

        function randomSelect() {
            let r = Math.floor(Math.random() * 500) + 1;
            let els = document.querySelectorAll('.board-num');
            selectBoard(r, els[r - 1]);
            els[r - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const icon = document.getElementById('audioIcon');
            const btn = document.getElementById('audioToggleBtn');
            if (isAudioEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                btn.style.borderColor = '#00e676';
                btn.style.color = '#00e676';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.style.borderColor = '#ff2a2a';
                btn.style.color = '#ff2a2a';
            }
        }

        function getLetter(num) {
            if (num <= 15) return 'B';
            if (num <= 30) return 'I';
            if (num <= 45) return 'N';
            if (num <= 60) return 'G';
            return 'O';
        }

        function getLetterClass(letter) {
            switch(letter) {
                case 'B': return 'b-h'; case 'I': return 'i-h';
                case 'N': return 'n-h'; case 'G': return 'g-h'; case 'O': return 'o-h';
            }
        }

        function startLiveGame() {
            if (!selectedBoard) { alert("እባክዎን የካርቴላ ቁጥር ይምረጡ!"); return; }

            initAudio();

            document.getElementById('cartelaIdDisplay').innerText = selectedBoard;
            uncalledPool = Array.from({length: 75}, (_, i) => i + 1);
            calledNumbersHistory = [];
            lastCalledNum = null;
            resetUserMarks();
            
            showPage('gamePage');
            render75Board();
            renderCartela();
            
            if (callInterval) clearInterval(callInterval);
            if (countdownTimer) clearInterval(countdownTimer);

            // ⏳ የ5 ሰከንድ የማስጠንቀቂያ ቆጠራ ማስጀመር
            startCountdownBeforeGame();
        }

        // ⏱️ 5, 4, 3, 2, 1 የቆጠራ ተግባር
        function startCountdownBeforeGame() {
            let count = 5;
            document.getElementById('callStatusTitle').innerText = "⚠️ ጨዋታው ሊጀምር ነው!";
            document.getElementById('currentCallText').innerText = count;
            playBeep(600, 0.2);

            countdownTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    document.getElementById('currentCallText').innerText = count;
                    playBeep(600, 0.2); // ለቆጠራው ቢፕ ድምፅ
                } else {
                    clearInterval(countdownTimer);
                    document.getElementById('callStatusTitle').innerText = "Current Call";
                    playBeep(1000, 0.3); // የጅማሮ ድምፅ
                    
                    // ቆጠራው እንዳበቃ ቁጥሮቹን መጥራት ይጀምራል
                    callInterval = setInterval(triggerNextCall, 3500);
                    triggerNextCall();
                }
            }, 1000);
        }

        function triggerNextCall() {
            if (uncalledPool.length === 0) {
                clearInterval(callInterval);
                alert("ሁሉም ቁጥሮች ተጠርተዋል!");
                return;
            }

            let randomIndex = Math.floor(Math.random() * uncalledPool.length);
            let num = uncalledPool.splice(randomIndex, 1)[0];

            lastCalledNum = num;
            calledNumbersHistory.push(num);

            document.getElementById('callCount').innerText = calledNumbersHistory.length;

            let letter = getLetter(num);
            document.getElementById('currentCallText').innerText = `${letter}-${num}`;
            updateRecentCallsUI();
            render75Board();

            // 🔊 የቁጥር ጥሪ ድምፅ
            playBeep(750, 0.2);
        }

        function updateRecentCallsUI() {
            const container = document.getElementById('recentCallsContainer');
            container.innerHTML = '';
            let recent = calledNumbersHistory.slice(-5).reverse();
            recent.forEach(num => {
                let letter = getLetter(num);
                let pill = document.createElement('div');
                pill.className = `call-pill ${getLetterClass(letter)}`;
                pill.innerText = `${letter}-${num}`;
                container.appendChild(pill);
            });
        }

        function render75Board() {
            const grid75 = document.getElementById('grid75');
            grid75.innerHTML = '';
            for (let row = 0; row < 15; row++) {
                for (let col = 0; col < 5; col++) {
                    let num = (col * 15) + (row + 1);
                    let div = document.createElement('div');
                    div.className = 'num-cell'; div.innerText = num;

                    if (num === lastCalledNum) {
                        div.classList.add('last-called');
                    } else if (calledNumbersHistory.includes(num)) {
                        div.classList.add('called');
                    }

                    grid75.appendChild(div);
                }
            }
        }

        function renderCartela() {
            const container = document.getElementById('playerCartela');
            container.innerHTML = '';
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    let val = cartelaData[r][c];
                    let cell = document.createElement('div');
                    cell.className = 'c-cell';
                    
                    if (val === '*') {
                        cell.innerText = '★'; cell.classList.add('free-star');
                    } else {
                        cell.innerText = val;
                        if (userMarkedGrid[r][c]) {
                            cell.classList.add('marked');
                        }
                    }

                    cell.onclick = () => {
                        if (val !== '*') {
                            userMarkedGrid[r][c] = !userMarkedGrid[r][c];
                            renderCartela();
                        }
                    };
                    container.appendChild(cell);
                }
            }
        }

        function resetUserMarks() {
            userMarkedGrid = [
                [false, false, false, false, false],
                [false, false, false, false, false],
                [false, false, true,  false, false],
                [false, false, false, false, false],
                [false, false, false, false, false]
            ];
            renderCartela();
        }

        function checkBingo() {
            let isWinner = false;

            for (let r = 0; r < 5; r++) {
                if (userMarkedGrid[r].every(val => val === true)) {
                    if (validateCalledNumbersInLine('row', r)) isWinner = true;
                }
            }

            for (let c = 0; c < 5; c++) {
                let colWin = true;
                for (let r = 0; r < 5; r++) {
                    if (!userMarkedGrid[r][c]) colWin = false;
                }
                if (colWin && validateCalledNumbersInLine('col', c)) isWinner = true;
            }

            let diag1 = true, diag2 = true;
            for (let i = 0; i < 5; i++) {
                if (!userMarkedGrid[i][i]) diag1 = false;
                if (!userMarkedGrid[i][4 - i]) diag2 = false;
            }
            if (diag1 && validateCalledNumbersInLine('diag1', 0)) isWinner = true;
            if (diag2 && validateCalledNumbersInLine('diag2', 0)) isWinner = true;

            if (isWinner) {
                if (callInterval) clearInterval(callInterval);
                playWinSound();
                alert("🎉 🎉 BINGO! እንኳን ደስ አለዎት አሸንፈዋል! 🎉 🎉");
            } else {
                alert("❌ ቢንጎ አልሰራህም!");
            }
        }

        function validateCalledNumbersInLine(type, index) {
            let numsToCheck = [];
            
            if (type === 'row') {
                numsToCheck = cartelaData[index];
            } else if (type === 'col') {
                for (let r = 0; r < 5; r++) numsToCheck.push(cartelaData[r][index]);
            } else if (type === 'diag1') {
                for (let i = 0; i < 5; i++) numsToCheck.push(cartelaData[i][i]);
            } else if (type === 'diag2') {
                for (let i = 0; i < 5; i++) numsToCheck.push(cartelaData[i][4 - i]);
            }

            return numsToCheck.every(num => num === '*' || calledNumbersHistory.includes(num));
        }

        function leaveGame() {
            if (callInterval) clearInterval(callInterval);
            if (countdownTimer) clearInterval(countdownTimer);
            showPage('lobbyPage');
        }
    </script>
</body>
</html>
