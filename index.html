<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wana Bingo - Game Screen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #051a24; color: white; padding-bottom: 70px; user-select: none; }

        .status-header {
            background-color: #d4edda; color: #155724; text-align: center;
            padding: 4px; font-size: 11px; font-weight: bold;
        }

        .container { padding: 8px; }

        /* ===== LIVE GAME LAYOUT ===== */
        .game-top-bar {
            display: flex; justify-content: space-between; gap: 4px; margin-bottom: 8px;
        }
        .top-card {
            background: #092e42; border-radius: 6px; padding: 4px;
            text-align: center; flex: 1; border: 1px solid #14435c;
        }
        .top-card label { display: block; font-size: 8px; color: #88a0a8; }
        .top-card span { font-size: 11px; font-weight: bold; color: #4fd1c5; }

        /* Main Game Split Section */
        .game-main-layout {
            display: flex; gap: 6px; align-items: flex-start;
        }

        /* 1. Left Call Board (1-75) */
        .call-board-left {
            width: 42%; background: #082535; border-radius: 8px;
            padding: 4px; border: 1px solid #103a50;
        }
        .board-header-row {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
            text-align: center; font-weight: bold; font-size: 10px; margin-bottom: 3px;
        }
        .b-h { background: #e53935; color: white; border-radius: 2px; }
        .i-h { background: #1e88e5; color: white; border-radius: 2px; }
        .n-h { background: #43a047; color: white; border-radius: 2px; }
        .g-h { background: #fb8c00; color: white; border-radius: 2px; }
        .o-h { background: #8e24aa; color: white; border-radius: 2px; }

        .numbers-grid-75 {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
        }
        .num-cell {
            background: #0d3448; color: #7f9ca7; text-align: center;
            padding: 3px 0; border-radius: 2px; font-size: 8px; font-weight: bold;
        }
        .num-cell.called { background: #00e676; color: #000; }
        .num-cell.last-called { background: #ff3d00; color: #fff; box-shadow: 0 0 5px #ff3d00; }

        /* 2. Right Cartela & Call Display */
        .cartela-section-right {
            width: 58%; display: flex; flex-direction: column; gap: 6px;
        }

        /* Call Displays */
        .timer-card {
            background: #092e42; border-radius: 6px; padding: 4px; text-align: center;
            font-size: 9px; color: #4fd1c5; border: 1px solid #14435c;
        }
        .current-call-box {
            background: linear-gradient(90deg, #1e88e5, #1565c0);
            border-radius: 8px; padding: 6px; text-align: center;
            font-size: 16px; font-weight: bold; color: white; box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
        }
        .recent-calls {
            display: flex; gap: 2px; justify-content: space-between; overflow-x: auto;
        }
        .call-pill {
            padding: 2px 4px; border-radius: 4px; font-size: 8px; font-weight: bold; color: white; flex: 1; text-align: center;
        }

        /* Player Cartela Card */
        .cartela-card {
            background: #0a2d3e; border-radius: 10px; padding: 6px;
            border: 1px solid #184b66; text-align: center;
        }
        .cartela-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-bottom: 4px;
        }
        .c-cell {
            background: #ffffff; color: #111; border-radius: 4px;
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; cursor: pointer;
        }
        .c-cell.free-star { background: #2ecc71; color: white; font-size: 12px; }
        .c-cell.marked { background: #ff3d00; color: white; }
        .cartela-footer { font-size: 9px; color: #88a0a8; font-weight: bold; }

        /* Control Buttons */
        .game-controls { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .btn-bingo {
            background: linear-gradient(90deg, #ff9800, #f57c00);
            color: white; border: none; padding: 10px; border-radius: 20px;
            font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase;
        }
        .btn-bottom-row { display: flex; gap: 6px; }
        .btn-sub {
            flex: 1; padding: 8px; border-radius: 15px; border: none;
            font-weight: bold; font-size: 10px; color: white; cursor: pointer;
        }
        .btn-refresh { background: #0097a7; }
        .btn-leave { background: #e53935; }

        /* Tab Displays */
        #lobbyPage, #leaderboardPage, #selectionPage { display: none; }
        #gamePage { display: block; }
    </style>
</head>
<body>

    <div class="status-header">
        <i class="fa-solid fa-circle-check"></i> Connected
    </div>

    <div class="container">
        <!-- ===== LIVE GAME PAGE ===== -->
        <div id="gamePage">
            <!-- Top Status Cards -->
            <div class="game-top-bar">
                <div class="top-card"><label>Games</label><span>1</span></div>
                <div class="top-card"><label>Players</label><span>5</span></div>
                <div class="top-card"><label>Call</label><span id="callCount">6</span></div>
            </div>

            <!-- Main Layout Split -->
            <div class="game-main-layout">
                
                <!-- LEFT SIDE: 1-75 Numbers Board -->
                <div class="call-board-left">
                    <div class="board-header-row">
                        <div class="b-h">B</div><div class="i-h">I</div><div class="n-h">N</div><div class="g-h">G</div><div class="o-h">O</div>
                    </div>
                    <div class="numbers-grid-75" id="grid75">
                        <!-- Javascript generates 1 to 75 numbers vertically or horizontally -->
                    </div>
                </div>

                <!-- RIGHT SIDE: Cartela & Display -->
                <div class="cartela-section-right">
                    <div class="timer-card">Countdown: <span style="color:#ffc107;" id="timerSecs">--</span></div>
                    
                    <div class="current-call-box">
                        Current Call <br> <span id="currentCallText" style="font-size: 20px;">I-27</span>
                    </div>

                    <div class="recent-calls">
                        <div class="call-pill b-h">I-27</div>
                        <div class="call-pill n-h">N-40</div>
                        <div class="call-pill b-h">B-12</div>
                        <div class="call-pill o-h">O-71</div>
                        <div class="call-pill g-h">G-51</div>
                    </div>

                    <!-- Cartela Board -->
                    <div class="cartela-card">
                        <div class="board-header-row" style="margin-bottom: 4px;">
                            <div class="b-h">B</div><div class="i-h">I</div><div class="n-h">N</div><div class="g-h">G</div><div class="o-h">O</div>
                        </div>
                        <div class="cartela-grid" id="playerCartela">
                            <!-- 5x5 Grid generated by JS -->
                        </div>
                        <div class="cartela-footer">Cartela Number: <span id="cartelaIdDisplay" style="color:white;">20</span></div>
                    </div>
                </div>

            </div>

            <!-- Bottom Action Buttons -->
            <div class="game-controls">
                <button class="btn-bingo" onclick="checkBingo()">Bingo</button>
                <div class="btn-bottom-row">
                    <button class="btn-sub btn-refresh" onclick="location.reload()">Refresh</button>
                    <button class="btn-sub btn-leave" onclick="leaveGame()">Leave Game</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Demo Cartela Numbers (5x5)
        const cartelaData = [
            [7, 25, 37, 60, 70],
            [13, 20, 43, 50, 69],
            [4, 18, '*', 55, 74],
            [5, 26, 40, 48, 67],
            [8, 17, 39, 46, 73]
        ];

        // Demo Called Numbers
        const calledNumbers = [27, 40, 12, 71, 51, 1]; 

        // Render 1-75 Left Call Board
        function render75Board() {
            const grid75 = document.getElementById('grid75');
            grid75.innerHTML = '';

            for (let row = 0; row < 15; row++) {
                for (let col = 0; col < 5; col++) {
                    let num = (col * 15) + (row + 1);
                    let div = document.createElement('div');
                    div.className = 'num-cell';
                    div.innerText = num;

                    if (calledNumbers.includes(num)) {
                        div.classList.add('called');
                    }
                    if (num === 27) { // Example for last called
                        div.classList.add('last-called');
                    }
                    grid75.appendChild(div);
                }
            }
        }

        // Render Player Cartela Right Side
        function renderCartela() {
            const container = document.getElementById('playerCartela');
            container.innerHTML = '';

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    let val = cartelaData[r][c];
                    let cell = document.createElement('div');
                    cell.className = 'c-cell';

                    if (val === '*') {
                        cell.innerText = '★';
                        cell.classList.add('free-star');
                    } else {
                        cell.innerText = val;
                        // Auto-mark if number was called
                        if (calledNumbers.includes(val)) {
                            cell.classList.add('marked');
                        }
                    }

                    // Toggle manual mark on click
                    cell.onclick = () => {
                        if (val !== '*') cell.classList.toggle('marked');
                    };

                    container.appendChild(cell);
                }
            }
        }

        function checkBingo() {
            alert("ቢንጎ ማረጋገጫ በመካሄድ ላይ ነው! 🎉");
        }

        function leaveGame() {
            if(confirm("ከጨዋታው መውጣት ይፈልጋሉ?")) {
                alert("ወደ Lobby በመመለስ ላይ...");
            }
        }

        // Initialize Page
        render75Board();
        renderCartela();
    </script>
</body>
</html>
