<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wana Bingo</title>
    <style>
        /* ጠቅላላ የበስተጀርባ እና የገጽ ዲዛይን */
        body {
            background-color: #0b1d28;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* የኪስ ቦርሳ (Wallet Balance) ክፍል */
        .wallet-container {
            background-color: #122b3d;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #1a3a52;
        }

        .wallet-title {
            font-size: 16px;
            color: #a0b0bc;
        }

        .wallet-balance {
            font-size: 20px;
            font-weight: bold;
            color: #ff9900;
        }

        /* የቢንጎ ቁጥሮች መደርደሪያ ሰሌዳ */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
        }

        /* የነጠላ ቁጥሮች ሳጥን ዲዛይን */
        .number-box {
            background-color: #1e3d54;
            border: 2px solid #285270;
            border-radius: 8px;
            padding: 15px 0;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* ተጠቃሚው ቁጥር ሲመርጥ የሚኖረው ከለር */
        .number-box.selected {
            background-color: #ff9900;
            border-color: #ffffff;
            color: #0b1d28;
        }

        /* የበተኖች መያዣ ክፍል */
        .button-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        /* አጠቃላይ የበተን ዲዛይን */
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn-refresh {
            background-color: #1a3a52;
            color: #ffffff;
        }

        .btn-start {
            background-color: #ff3b30;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. የኪስ ቦርሳ (Wallet) -->
    <div class="wallet-container">
        <span class="wallet-title">💳 Wallet Balance</span>
        <span class="wallet-balance">0 ETB</span>
    </div>

    <!-- 2. የቁጥሮች ሰሌዳ (ምሳሌ 15 ቁጥሮች) -->
    <div class="grid-container" id="bingoGrid">
        <!-- ቁጥሮቹ በጃቫስክሪፕት አማካኝነት እዚህ ይፈጠራሉ -->
    </div>

    <!-- 3. መቆጣጠሪያ በተኖች -->
    <div class="button-container">
        <button class="btn btn-refresh" onclick="refreshNumbers()">Refresh</button>
        <button class="btn btn-start" onclick="startGame()">Start Game</button>
    </div>

    <script>
        // ቁጥሮችን በራስ-ሰር ሰሌዳው ላይ መደርደር
        const grid = document.getElementById('bingoGrid');
        
        // ከ 1 እስከ 25 ያሉ ቁጥሮችን በሳጥን ሰርቶ ማስገባት
        for (let i = 1; i <= 25; i++) {
            const box = document.createElement('div');
            box.className = 'number-box';
            box.innerText = i < 10 ? '0' + i : i; // 01, 02 እያደረገ እንዲያምር
            
            // ሳጥኑ ሲነካ ከለር እንዲቀይር ማድረግ
            box.addEventListener('click', function() {
                box.classList.toggle('selected');
            });
            
            grid.appendChild(box);
        }

        // Refresh በተን ሲነካ
        function refreshNumbers() {
            alert('ቁጥሮች በድጋሚ እየተዘጋጁ ነው...');
        }

        // Start Game በተን ሲነካ
        function startGame() {
            alert('የቢንጎ ጨዋታ ተጀምሯል!');
        }
    </script>
</body>
</html>
