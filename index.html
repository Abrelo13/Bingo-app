<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Bingo - Board Selection</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b1d28;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0; padding: 15px;
        }
        .header {
            background: #102a3a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        /* የካርቴላ መምረጫ ክፍል */
        .selection-area {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #17384e;
            background: #17384e;
            color: white;
            width: 150px;
        }
        .btn-select {
            background: #e67e22;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* የቢንጎ ካርቴላ (Table) */
        .board-container {
            display: none; /* መጀመሪያ አይታይም */
            margin: 0 auto;
            max-width: 350px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #17384e;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #0b1d28;
            width: 20%;
            height: 50px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        th {
            background: #27ae60;
            color: white;
            font-size: 22px;
        }
        td.matched {
            background: #e67e22;
            color: white;
        }
        .free-cell {
            background: #e67e22;
            font-size: 12px;
        }

        .action-btns {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-start { background: #ff4747; }
        .btn-reset { background: #17384e; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Wana Bingo</h2>
        <p>Wallet: <span id="balance">100 ETB</span></p>
    </div>

    <!-- የካርቴላ መምረጫ -->
    <div class="selection-area" id="selectionArea">
        <input type="number" id="boardIdInput" placeholder="የካርቴላ ቁጥር (1-25)">
        <button class="btn-select" onclick="selectBoard()">SELECT BOARD</button>
    </div>

    <!-- የወጣው ቁጥር የሚታይበት -->
    <div id="statusText" style="margin: 15px 0; color: #f1c40f;"></div>

    <!-- የቢንጎ ካርቴላ የሚታይበት -->
    <div class="board-container" id="boardContainer">
        <h3 id="boardTitle">Board #</h3>
        <table id="bingoTable">
            <thead>
                <tr>
                    <th>B</th><th>I</th><th>N</th><th>G</th><th>O</th>
                </tr>
            </thead>
            <tbody id="boardBody">
                <!-- ቁጥሮች እዚህ ይገባሉ -->
            </tbody>
        </table>
        
        <div class="action-btns">
            <button class="btn-action btn-reset" onclick="resetSelection()">RESET</button>
            <button class="btn-action btn-start" id="startBtn" onclick="startGame()">START GAME</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. የካርቴላዎች ዳታቤዝ (ምሳሌ)
        const bingoBoards = {
            "1": [[10,22,35,49,62],[5,28,40,55,70],[12,19,"FREE",51,66],[8,25,33,58,73],[15,30,42,47,61]],
            "25": [[11,26,39,51,75],[3,28,33,56,67],[10,24,"FREE",58,74],[7,18,45,53,69],[13,30,44,47,64]]
            // ለሙከራ 1 እና 25 ብቻ ተጠቅሜያለሁ (አንተ ምስል ላይ ያለው #27 ነው፣ እኔ #25 አልኩት)
        };

        let currentBoard = null;
        let gameInterval = null;

        // 2. ተጫዋቹ ካርቴላ ሲመርጥ
        function selectBoard() {
            const boardId = document.getElementById('boardIdInput').value;
            
            if (!bingoBoards[boardId]) {
                alert("ይቅርታ፣ ይህ የካርቴላ ቁጥር የለም! (1 ወይም 25 ይሞክሩ)");
                return;
            }

            currentBoard = bingoBoards[boardId];
            displayBoard(boardId);
        }

        // 3. ካርቴላውን በስክሪኑ ላይ ማሳየት
        function displayBoard(boardId) {
            document.getElementById('selectionArea').style.display = 'none';
            document.getElementById('boardContainer').style.display = 'block';
            document.getElementById('boardTitle').innerText = `Board #${boardId}`;
            
            const tbody = document.getElementById('boardBody');
            tbody.innerHTML = ''; // የድሮውን አጽዳ

            // የ 5x5 ሰንጠረዥ ፍጠር
            for (let i = 0; i < 5; i++) {
                let row = document.createElement('tr');
                for (let j = 0; j < 5; j++) {
                    let cell = document.createElement('td');
                    let value = currentBoard[i][j];
                    
                    if (value === "FREE") {
                        cell.innerText = "FREE";
                        cell.className = "free-cellMatched"; // FREE ሁልጊዜ የበራ ነው
                    } else {
                        cell.innerText = value;
                        cell.id = `cell-${value}`; // በኋላ ለማግኘት
                    }
                    row.appendChild(cell);
                }
                tbody.appendChild(row);
            }
        }

        // 4. ጨዋታውን ማስጀመር (Start Game)
        function startGame() {
            if (!currentBoard) return;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('statusText').innerText = "ጨዋታው ተጀምሯል...";
            
            let drawnNumbers = [];
            let matchedCount = 0;
            
            gameInterval = setInterval(() => {
                if (drawnNumbers.length >= 15) { // 15 ቁጥሮች ብቻ እንዲወጡ
                    clearInterval(gameInterval);
                    document.getElementById('statusText').innerText = "ጨዋታው ተጠናቋል!";
                    document.getElementById('startBtn').disabled = false;
                    return;
                }

                // በዘፈቀደ ቁጥር መምረጥ (1-75)
                let randomNum;
                do {
                    randomNum = Math.floor(Math.random() * 75) + 1;
                } while (drawnNumbers.includes(randomNum));

                drawnNumbers.push(randomNum);
                document.getElementById('statusText').innerText = `የወጣው ቁጥር፦ ${randomNum}`;

                // በካርቴላው ላይ መኖሩን ፈትሽ
                const cell = document.getElementById(`cell-${randomNum}`);
                if (cell) {
                    cell.className = "matched"; // ብርቱካናማ ቀለም
                }

            }, 2000); // በየ 2 ሰከንዱ
        }

        // 5. እንደገና መምረጥ (Reset)
        function resetSelection() {
            clearInterval(gameInterval);
            currentBoard = null;
            document.getElementById('boardIdInput').value = '';
            document.getElementById('statusText').innerText = '';
            document.getElementById('selectionArea').style.display = 'flex';
            document.getElementById('boardContainer').style.display = 'none';
            document.getElementById('startBtn').disabled = false;
        }

    </script>
</body>
</html>
